# COMPLETE SILENCE - NO LOGS AT ALL
org.slf4j.simpleLogger.defaultLogLevel=OFF
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.dateTimeFormat=
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=false
org.slf4j.simpleLogger.levelInBrackets=false

# DISABLE ALL LOGGERS
org.slf4j.simpleLogger.log.org.xerial=OFF
org.slf4j.simpleLogger.log.sqlite=OFF
org.slf4j.simpleLogger.log.org.sqlite=OFF
org.slf4j.simpleLogger.log.org.slf4j=OFF